# NGINX Configuration for Rhino Compute Load Balancer
# Install NGINX for Windows: https://nginx.org/en/download.html
# Place this file in: C:\nginx\conf\nginx.conf

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Logging
    access_log logs/access.log;
    error_log logs/error.log;

    # Timeouts for long-running compute operations
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    send_timeout 300s;

    # Buffer sizes for large requests/responses
    client_max_body_size 100M;
    proxy_buffering off;
    proxy_request_buffering off;

    # Upstream compute servers
    upstream compute_backend {
        # Load balancing method: least_conn (fewest active connections)
        # Other options: round_robin (default), ip_hash (sticky sessions)
        least_conn;

        # Add your compute servers here
        # Format: server <hostname>:<port> [parameters];
        # Parameters:
        #   max_fails=N       - Mark server down after N failed attempts (default: 1)
        #   fail_timeout=T    - Time to wait before retrying failed server (default: 10s)
        #   weight=N          - Relative weight for load distribution (default: 1)
        #   backup            - Only use this server when all others are down
        #   down              - Temporarily disable this server

        #BACKEND_SERVERS_PLACEHOLDER

        # Example: Add a backup server
        # server 192.168.1.99:5000 backup;

        # Health check (requires nginx_upstream_check_module - not in standard Windows build)
        # For health checks, you'll need to manually test /healthcheck/ready endpoint
        # or use nginx-plus (commercial) which has native health checks
    }

    # Main server block
    server {
        listen 80;
        server_name localhost;  # Change to your domain name

        # Health check endpoint (proxy to backend health)
        location /healthcheck/ready {
            proxy_pass http://compute_backend/healthcheck/ready;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Status endpoint for monitoring
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 192.168.0.0/16;  # Adjust to your internal network
            deny all;
        }

        # Main proxy to compute backend
        location / {
            proxy_pass http://compute_backend;
            proxy_http_version 1.1;

            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Disable buffering for streaming responses
            proxy_buffering off;
            proxy_cache off;

            # CORS headers (if needed)
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;

            # Handle OPTIONS requests
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization";
                add_header Access-Control-Max-Age 1728000;
                add_header Content-Type 'text/plain; charset=utf-8';
                add_header Content-Length 0;
                return 204;
            }
        }
    }

    # Optional: HTTPS configuration
    # Uncomment and configure SSL certificates
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #
    #     ssl_certificate /path/to/cert.pem;
    #     ssl_certificate_key /path/to/key.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #
    #     location / {
    #         proxy_pass http://compute_backend;
    #         proxy_http_version 1.1;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto https;
    #         proxy_buffering off;
    #     }
    # }
}
